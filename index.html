<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#14213d;--mut:#667188;--pri:#2f5be0;--pri2:#1fa3b5;--gold:#e8a21c;--pt:#fff;--ok:#12805c;--er:#c0302b;--bd:#e1e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1320;--card:#172033;--tx:#e8edf6;--mut:#9aa6ba;--pri:#6c8cff;--pri2:#4fc3d4;--pt:#0b1020;--ok:#4cd6a0;--er:#ff7b76;--bd:#27344a}}
:root[data-theme="dark"]{--bg:#0d1320;--card:#172033;--tx:#e8edf6;--mut:#9aa6ba;--pri:#6c8cff;--pri2:#4fc3d4;--pt:#0b1020;--ok:#4cd6a0;--er:#ff7b76;--bd:#27344a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:16px;display:flex;align-items:center;gap:14px}
header img{width:62px;height:62px;border-radius:14px;background:#f5f6f9;object-fit:contain;padding:4px;box-shadow:0 2px 10px #0003}
header h1{margin:0;font-size:19px}header small{opacity:.9}
nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;background:transparent;color:var(--mut);padding:9px 14px;border-radius:10px;font-weight:600}
nav button.on{background:var(--pri);color:var(--pt)}
main{max-width:980px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}
button.p{background:var(--pri);color:var(--pt);border-color:var(--pri)}button.d{color:var(--er)}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600}
.msg{padding:10px;border-radius:9px;margin:8px 0}.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.msg.er{background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}.tag.o{color:var(--ok);border-color:var(--ok)}
.code{font-size:32px;letter-spacing:7px;font-weight:700;text-align:center;direction:ltr;color:var(--pri)}
.mut{color:var(--mut);font-size:13px}.fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.pod div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.pod div:first-child{border-color:var(--gold)}.pod b{display:block}.pod .n{font-size:24px;color:var(--pri);font-weight:700}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;margin:2px;font-size:13px}.chip i{cursor:pointer;color:var(--er);font-style:normal}
details{margin-top:8px}summary{cursor:pointer;color:var(--pri);font-weight:600}
header{flex-direction:column;text-align:center;padding:28px 16px 36px;background:linear-gradient(160deg,#0f1b3d,#1f4fd8 55%,#1fa3b5);gap:12px}
header img{width:136px;height:136px;border-radius:28px;padding:10px;box-shadow:0 12px 32px #0007}
header h1{font-size:27px}header small{font-size:14px;opacity:.88}
nav{justify-content:safe center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px}
nav button{padding:10px 16px;border-radius:99px}nav button.on{box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 45%,transparent)}
.card{border-radius:18px;box-shadow:0 2px 16px #0f1b3d14;padding:18px}h2{font-size:17px;padding-bottom:8px;border-bottom:2px solid var(--bd)}
button.p{box-shadow:0 3px 10px color-mix(in srgb,var(--pri) 35%,transparent)}th{background:var(--bg)}tr:hover td{background:color-mix(in srgb,var(--pri) 6%,transparent)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center;color:var(--mut);font-size:13px}.kpi .n{display:block;font-size:28px;font-weight:700;color:var(--pri)}
.fire{color:#e8741c;font-weight:700}.sat{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 18%,var(--card)),var(--card))}details.card summary{font-size:13px}
.rk{display:flex;align-items:center;gap:14px;border-radius:18px;padding:16px;margin-bottom:10px;border:1px solid var(--bd);background:var(--card)}
.rk .no{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none;background:var(--bg);color:var(--pri)}
.rk .inf{flex:1;min-width:0}.rk .nm{font-weight:700;font-size:16px}.rk .sc{text-align:center}.rk .sc b{font-size:28px;display:block;line-height:1}
.bar{height:7px;border-radius:9px;background:var(--bd);overflow:hidden;margin:7px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.r1,.r2,.r3{border:0}.r1 .mut,.r2 .mut,.r3 .mut{color:inherit;opacity:.8}.r1 .no,.r2 .no,.r3 .no{background:#ffffff80;color:inherit}.r1 .bar,.r2 .bar,.r3 .bar{background:#0002}.r1 .bar i,.r2 .bar i,.r3 .bar i{background:#0007}
.r1{padding:26px 18px;background:linear-gradient(135deg,#f8d36a,#e8a21c 55%,#b8780a);color:#2b1a00;box-shadow:0 12px 30px #e8a21c55}.r1 .no{width:66px;height:66px;font-size:30px}.r1 .nm{font-size:20px}.r1 .sc b{font-size:40px}
.r2{padding:20px 18px;background:linear-gradient(135deg,#f1f4f9,#b9c3d3);color:#1d2635;box-shadow:0 8px 22px #8a96aa44}.r2 .no{width:54px;height:54px;font-size:25px}.r2 .sc b{font-size:34px}
.r3{background:linear-gradient(135deg,#f3d6b8,#c9824a);color:#2e1604;box-shadow:0 6px 18px #c9824a44}.r3 .no{width:50px;height:50px;font-size:23px}
body{font-family:Cairo,Tajawal,Tahoma,sans-serif}
:root{--bg:#f8fafc;--tx:#241d78;--pri:#241d78;--pri2:#1d4f86;--gold:#F5B301;--pt:#fff;--mut:#5d6b80;--bd:#e2e8f0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0b3a;--card:#10283f;--tx:#eef2f8;--pri:#F5B301;--pri2:#e0b963;--pt:#0e0b3a;--mut:#9fb0c6;--bd:#1f3a57}}
header{background:linear-gradient(160deg,#1b1560,#241d78 60%,#3b36a8);border-bottom:4px solid #F5B301}
nav button.on{border-bottom:3px solid #F5B301}h2{border-bottom:2px solid #F5B301}
.kpi .n,.pod .n{color:#F5B301}.card{border-color:var(--bd)}
/* accordion tabs */
main{max-width:1100px}
.acc{list-style:none;margin:0 0 12px;padding:0;display:flex;gap:8px;min-height:520px}
.acc[hidden]{display:none}
.acc-item{flex:0 0 64px;min-width:0;display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:16px;background:color-mix(in srgb,var(--pri) 7%,var(--card));overflow:hidden;scroll-margin-top:8px;transition:flex .6s cubic-bezier(.7,0,.2,1),background .3s,border-color .3s,box-shadow .3s}
.acc-item:not(.on):hover{background:color-mix(in srgb,var(--gold) 16%,var(--card));border-color:var(--gold)}
.acc-item.on{flex:1 1 0;background:var(--bg);border-color:color-mix(in srgb,var(--gold) 70%,var(--bd));box-shadow:0 10px 30px #0f1b3d1a}
.acc .acc-head{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;border:0;border-radius:0;background:transparent;color:var(--tx);padding:18px 0;font:inherit;font-weight:700;cursor:pointer}
.acc-no{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--gold)}
.acc-ic{display:grid;place-items:center;color:var(--pri)}
.acc-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acc-vl{writing-mode:vertical-rl;font-size:14px;white-space:nowrap}
.acc-hd{display:none;font-size:18px}
.acc-item.on .acc-head{flex-direction:row;justify-content:flex-start;gap:12px;padding:15px 18px;border-bottom:1px solid var(--bd);cursor:default}
.acc-item.on .acc-head::after{content:"";position:absolute;inset-inline-start:18px;bottom:-1px;width:44px;height:2px;background:var(--gold)}
.acc-item.on .acc-vl{display:none}.acc-item.on .acc-hd{display:inline}
.acc-item.on .acc-no{order:3;margin-inline-start:auto}
.acc-body{display:none;flex:1;min-width:0;padding:14px}
.acc-item.on .acc-body{display:block;animation:accIn .5s .2s both}
@keyframes accIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:720px){.acc{flex-direction:column;min-height:0}.acc-item,.acc-item.on{flex:none;transition:background .3s,border-color .3s}.acc .acc-head{flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 16px}.acc-no{order:3;margin-inline-start:auto}.acc-vl{writing-mode:horizontal-tb}.acc-body{padding:10px}}
@media(prefers-reduced-motion:reduce){.acc-item{transition:none}.acc-item.on .acc-body{animation:none}}
/* home hero */
.hero{position:relative;height:clamp(400px,64vh,520px);border-radius:14px;overflow:hidden;isolation:isolate;color:#fff;background:radial-gradient(ellipse at 50% 35%,#3b36a8 0%,#241d78 45%,#0e0b3a 100%);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.h-noise{opacity:.09;mix-blend-mode:overlay;pointer-events:none}.h-glow,.h-part{pointer-events:none}
.h-mark{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;pointer-events:none;padding:0 16px 44px}
.h-mark img{width:84px;height:84px;object-fit:contain;border-radius:20px;background:#f5f6f9;padding:6px;box-shadow:0 10px 30px #0006}
.h-t{margin:0;font-size:clamp(26px,4.4vw,44px);line-height:1.25;font-weight:800;text-shadow:0 2px 30px #000a}
.h-bottom{position:absolute;inset-inline:20px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap;font-size:12px;color:#d6dcff}
.h-bottom p{margin:0}.h-bottom .h-sub{margin-top:2px;color:var(--gold)}
.h-links{display:flex;align-items:center;gap:8px}
.h-links button{background:none;border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 2px;color:#fff;font-size:13px}
.h-links button:hover{border-bottom-color:var(--gold);color:var(--gold)}.h-links span{opacity:.4}
header.hero-top{display:block;padding:0;gap:0;height:clamp(300px,46vh,440px);border-radius:0;border:0;border-bottom:4px solid #F5B301;background:radial-gradient(ellipse at 50% 35%,#3b36a8 0%,#241d78 45%,#0e0b3a 100%)}
.hero-top .h-mark img{width:96px;height:96px}
.hero-top .h-mark small{display:block;margin-top:6px;font-size:13px;opacity:.85;color:#d6dcff}
.h-links[hidden]{display:none}
.el{position:relative;height:clamp(300px,50vh,420px);border-radius:14px;overflow:hidden;touch-action:pan-y;background:radial-gradient(ellipse at 50% 40%,#332b96 0%,#1b1560 55%,#0b0933 100%);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.el-gl{position:absolute;inset:0}
.el-sr{position:absolute;width:1px;height:1px;margin:0;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.el-by{position:absolute;inset-inline:0;bottom:14px;text-align:center;font-size:12px;color:#f6d36a;letter-spacing:.2px;pointer-events:none}
.el-fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(22px,4vw,34px);font-weight:800;line-height:1.6;color:#f3dfae;padding:0 16px 30px}
.el-fb[hidden]{display:none}
.wkhero{background:radial-gradient(ellipse at 50% 0%,#3b36a8,#241d78 55%,#0e0b3a);color:#fff;border-radius:20px;padding:22px 14px 20px;text-align:center;margin-bottom:12px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);box-shadow:0 14px 40px #0f2c4c40}
.wkhero h2{border:0;color:#fff;font-size:22px;margin:4px 0 14px;padding:0}.wk-k{color:var(--gold);font-size:12px;font-weight:700}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 10px}
.pd{flex:1;max-width:190px;border-radius:14px 14px 0 0;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pd b{font-size:15px}.pd .pm{font-size:28px}.pd i{font-style:normal;opacity:.5;font-weight:800;font-size:26px}
.p1{min-height:170px;background:linear-gradient(180deg,#f8d36a,#c9921a);color:#2b1a00}.p2{min-height:136px;background:linear-gradient(180deg,#eef2f8,#aeb9ca);color:#1d2635}.p3{min-height:112px;background:linear-gradient(180deg,#f3d6b8,#bd7a42);color:#2e1604}
.rest{margin:8px 0}.rest .chip{background:#ffffff18;border-color:#ffffff30;color:#fff}
.wk-note{background:#ffffff12;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.9;margin:10px auto;max-width:560px}
button.gold{background:var(--gold);color:#0e0b3a;border:0;font-weight:700}
